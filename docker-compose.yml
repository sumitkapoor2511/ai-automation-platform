services:
  db:
    image: postgres:16-alpine
    container_name: ai_automation_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: ai_automation_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ai_automation_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ai_automation_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - n8n

volumes:
  postgres_data:
  n8n_data:
